# electron-builder config for the Sebeto desktop app.
#
#   npm run dist -w @sebeto/desktop
#
# does everything: builds the workspace, stages a self-contained app in ./stage
# (scripts/stage.mjs: desktop main + built core/shared + production node_modules, with
# better-sqlite3 rebuilt for Electron's ABI inside ./stage only), and runs electron-builder on it.
# The workspace's own node_modules stay on Node's ABI, so `npm test` keeps working.
# Output (unsigned, nothing is published), on the platform it runs on:
#   Windows  release/Sebeto-Setup-<version>.exe              per-user NSIS installer (x64)
#   macOS    release/Sebeto-<version>-arm64.dmg / -x64.dmg   ad-hoc signed, not notarized
#   Linux    release/Sebeto-<version>-x86_64.AppImage, release/sebeto_<version>_amd64.deb
appId: app.sebeto.desktop
productName: Sebeto
copyright: Copyright © 2026 Sebeto contributors
directories:
  app: stage
  output: release
  buildResources: build
icon: build/icon.png
# Native modules are already rebuilt for Electron by scripts/stage.mjs (electron-builder's own
# rebuild would also touch the workspace root's node_modules).
npmRebuild: false
files:
  - "**/*"
  - "!vendor{,/**/*}"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.test.js"
  # better-sqlite3 C sources / build intermediates (only build/Release/*.node is loaded)
  - "!**/node_modules/better-sqlite3/{deps,src,docs}{,/**/*}"
  - "!**/node_modules/better-sqlite3/build/{deps,test_extension}{,/**/*}"
  - "!**/node_modules/better-sqlite3/build/Release/{obj,test_extension.node}{,/**/*}"
  - "!**/node_modules/better-sqlite3/build/Release/*.{iobj,ipdb,pdb,lib,exp}"
extraResources:
  # Built React UI, served by the core from <resources>/ui (see SEBETO_UI_DIR in src/main.ts).
  - from: ../../packages/ui/dist
    to: ui
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  # Per-user install (%LOCALAPPDATA%\Programs\Sebeto), no admin rights needed.
  oneClick: true
  perMachine: false
  artifactName: Sebeto-Setup-${version}.${ext}
  shortcutName: Sebeto
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  # The workspace lives in ~/.sebeto/workspace and is never removed by the uninstaller.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  category: public.app-category.productivity
  # Two .dmg files (Apple silicon and Intel) from one staged folder: scripts/stage.mjs merges the
  # arm64 and x64 builds of better-sqlite3 into one fat binary, so both apps load it.
  target:
    - target: dmg
      arch: [arm64, x64]
  # The .icns is generated by electron-builder from the 1024 px build/icon.png.
  icon: build/icon.png
  # No Apple Developer ID yet: ad-hoc signature (required to run on Apple silicon at all), no
  # notarization, so Gatekeeper blocks the first launch (see docs/14 Deployment Modes.md).
  # Hardened runtime is off because it rejects the Electron frameworks under an ad-hoc signature.
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: Sebeto-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  # electron-builder generates the hicolor icon sizes from the 1024 px PNG.
  icon: build/icon.png
  executableName: sebeto
  synopsis: Open-source AI team orchestrator
  # No contact e-mail yet; the deb Homepage field points to the GitHub project.
  maintainer: Sebeto contributors
appImage:
  artifactName: Sebeto-${version}-${arch}.${ext}
deb:
  artifactName: sebeto_${version}_${arch}.${ext}
