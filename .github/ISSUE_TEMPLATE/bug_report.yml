name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please do not open an issue; use Security → Report a vulnerability.
        Before attaching logs, use **Export diagnostics** in Sebeto: it removes names, paths and secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …\n3. See …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sebeto version
      placeholder: "0.9.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run Sebeto
      options: [Desktop app, npm start, Docker]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 27, Windows 11, Ubuntu 24.04…"
  - type: input
    id: runtime
    attributes:
      label: AI runtime
      placeholder: "Claude Code, Codex CLI, Ollama (model), OpenAI-compatible…"
