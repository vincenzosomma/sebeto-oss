name: Idea or feature request
description: Suggest something Sebeto should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to get done, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work? Remember that Sebeto is for people who never open a terminal.
  - type: textarea
    id: other
    attributes:
      label: Anything else
