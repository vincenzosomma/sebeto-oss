<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<button type="button" onClick="{{a.pick}}" style="{{cardStyle}}">
  <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
    <span style="font-weight: 700; font-size: 14px; color: #1C1C1A">{{a.name}}</span>
    <span style="font-size: 11px; color: #45453F; background: #EFEFEC; border-radius: 999px; padding: 2px 8px">{{a.runtime}}</span>
  </span>
  <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #45453F">
    <span style="{{a.dotStyle}}" aria-hidden="true"></span>{{a.statusText}}
  </span>
  <span style="font-size: 12px; color: #5F5F5A">{{a.heartbeat}}</span>
  <span style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 11px; color: #5F5F5A">Budget {{a.budget}}</span>
    <span style="display: block; height: 4px; background: #EFEFEC; border-radius: 2px"><span style="display: block; {{a.barStyle}}"></span></span>
  </span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agent":{"editor":null},"$preview":{"width":240,"height":150}}'>
var SAMPLE = { name: 'Writer', runtime: 'Claude', statusText: 'Working', dotStyle: 'width:8px;height:8px;border-radius:50%;background:#0E5A8A',
  heartbeat: 'Checks in every 1 h', budget: '$5.10 / $15', barStyle: 'width:34%;height:4px;border-radius:2px;background:#0E5A8A', selected: false, pick: function () {} };

class Component extends DCLogic {
  renderVals() {
    var a = this.props.agent || SAMPLE;
    return {
      a: a,
      cardStyle: 'display:flex;flex-direction:column;gap:6px;text-align:left;width:240px;box-sizing:border-box;padding:12px 14px;border-radius:12px;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;' +
        (a.selected ? 'border:2px solid #0E5A8A' : 'border:1px solid #D6D6D0')
    };
  }
}
</script>
</body>
</html>
